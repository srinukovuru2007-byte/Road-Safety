<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadGuard - Safe Driving Awareness</title>
    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Abstract blurred background representing traffic light colors -->
    <div class="background-effects">
        <div class="glow red"></div>
        <div class="glow yellow"></div>
        <div class="glow green"></div>
    </div>

    <main class="container">
        <header>
            <div class="icon">🛣️</div>
            <h1>RoadGuard</h1>
            <p>Your journey matters. Let's make it safe.</p>
        </header>

        <!-- User Input Section -->
        <section id="form-section">
            <div id="welcome-back" class="hidden"></div>
            
            <form id="safety-form">
                <div class="input-group">
                    <input type="text" id="name" required autocomplete="off">
                    <label for="name">Full Name</label>
                </div>

                <div class="input-group">
                    <select id="vehicle" required>
                        <option value="" disabled selected>Select your usual transport</option>
                        <option value="Two Wheeler">Two Wheeler (Bike/Scooter)</option>
                        <option value="Four Wheeler">Four Wheeler (Car)</option>
                        <option value="Heavy Vehicle">Heavy Vehicle (Bus/Truck)</option>
                        <option value="Pedestrian">Pedestrian / Cyclist</option>
                    </select>
                </div>

                <button type="submit" class="btn">Get Safety Guidelines</button>
            </form>
        </section>

        <!-- Dynamic Results Section -->
        <section id="results-section" class="hidden">
            <h2 id="greeting"></h2>
            
            <!-- Core Awareness Message -->
            <div class="awareness-message">
                <strong>Awareness Alert:</strong> Every year, millions are affected by road crashes. Being aware and following rules is our shared responsibility. Drive safe, save lives!
            </div>
            
            <div class="tips-container" id="tips-container">
                <!-- Tips will be injected here by Javascript -->
            </div>

            <div class="pledge-box">
                <p><b>Take the Road Safety Pledge</b></p>
                <label>
                    <input type="checkbox" id="pledge-check"> I pledge to follow these rules and prioritize safety.
                </label>
                <br>
                <button class="btn hidden" id="submit-pledge-btn" style="margin-top: 15px;" onclick="submitPledge()">Submit Pledge</button>
                <div id="pledge-success-msg" class="hidden" style="color: #4ade80; margin-top: 10px; font-weight: 600;"></div>
            </div>
            
            <button class="btn btn-secondary" onclick="resetForm()">Go Back</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
